import sys
import asyncio
import platform
import json
from pathlib import Path


# do not rename
async def custom_site():
    import embed

    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = True
    platform.window.canvas.style.visibility = "visible"

    bundle = "game"

    # The C or JS loader could do that, but be explicit.
    appdir = Path(f"/data/data/{bundle}")  # /data/data/game
    appdir.mkdir(parents=True, exist_ok=True)

    # Unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find(".itch.zone") > 0:

        import zipfile

        async with platform.fopen("game.apk", "rb") as archive:

            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())

    else:

        import tarfile

        async with platform.fopen("game.tar.gz", "rb") as archive:

            with tarfile.open(fileobj=archive, mode="r:gz") as tar:
                tar.extractall(
                    path=appdir.as_posix(),
                    filter="tar"
                )

    # Preloader will change to work dir and prepend it to sys.path
    platform.run_main(
        PyConfig,
        loaderhome=appdir / "assets",
        loadermain=None
    )

    # Wait for preloading to complete.
    # This includes images and WASM compilation of bundled modules.
    while embed.counter() < 0:
        await asyncio.sleep(0.1)

    main = appdir / "assets" / "main.py"

    if not platform.window.MM.UME:

        # Now that APK is mounted we have access to font cache.
        # We need to fill __file__ which is not yet set.
        __import__(__name__).__file__ = main

        # Prompt the user
        msg = "Ready to start! Please click/touch page"

        platform.window.infobox.innerText = msg

        print(
            "\n" * 4,
            f"    * Waiting for media user engagement. {msg} *",
            "\n" * 4
        )

        while not platform.window.MM.UME:
            await asyncio.sleep(0.1)

    # Start async top-level machinery if not started.
    await TopLevel_async_handler.start_toplevel(
        platform.shell,
        console=window.python.config.debug
    )

    # Now that APK is mounted we have access to font cache.
    # Fill __file__ / __name__ which are not yet set.
    __import__(__name__).__file__ = main

    async def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(
        main,
        callback=ui_callback
    )

    # If you don't reach this step,
    # your main.py may have an infinite sync loop.

    platform.window.infobox.style.display = "none"

    platform.window.config.gui_divider = 1

    platform.window.window_resize()

    print("default.tmpl: done")

    shell.interactive()


asyncio.run(custom_site())

        function show_infobox() {

            const infobox =
                document.getElementById("infobox");

            if (!infobox) {
                return;
            }

            infobox.style.display = "block";

            // Center relative to viewport
            const w = infobox.offsetWidth;
            const h = infobox.offsetHeight;

            const left =
                (window.innerWidth - w) / 2;

            const top =
                (window.innerHeight - h) / 2;

            infobox.style.left =
                left + "px";

            infobox.style.top =
                top + "px";
        }

    </script>

            fetch(url)

                .then(

                )

                .then(
                    (html) => {
                        info_inline(html);

                )

                .catch(
